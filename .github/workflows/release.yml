name: Android Build & Automatic Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release even without a tag?'
        required: false
        type: boolean
        default: true
      release_title:
        description: 'Release Title (optional)'
        required: false
        type: string
        default: 'CapGrok Auto Release'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK, AAB & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Prepare Keystore & Environment Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
        run: |
          # 1. Setup .env file
          if [ -f ".env.example" ]; then
            cp .env.example .env
          else
            touch .env
          fi

          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
          fi
          if [ -n "$GROK_API_KEY" ]; then
            echo "GROK_API_KEY=$GROK_API_KEY" >> .env
          fi

          # 2. Setup debug.keystore if debug.keystore.base64 exists
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 3. Setup Release Keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          else
            # Generate a valid release upload keystore if not provided via secrets
            keytool -genkey -v -keystore my-upload-key.jks \
              -storepass "$STORE_PASS" -alias "$KEY_ALIAS" -keypass "$KEY_PASS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=CapGrok,OU=Android,O=CapGrokApp,L=City,S=State,C=US"
          fi

      - name: Run Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Release & Debug APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          ./gradlew assembleRelease assembleDebug

      - name: Build Android App Bundle (AAB)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          ./gradlew bundleRelease

      - name: Prepare Output Artifacts
        id: prepare_artifacts
        run: |
          mkdir -p release-artifacts

          # Determine version name / tag
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION_TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION_TAG="v1.0.${{ github.run_number }}"
          fi
          echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"

          # Copy and rename Release APK
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp "app/build/outputs/apk/release/app-release.apk" "release-artifacts/CapGrok-${VERSION_TAG}-release.apk"
          fi

          # Copy and rename Debug APK
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp "app/build/outputs/apk/debug/app-debug.apk" "release-artifacts/CapGrok-${VERSION_TAG}-debug.apk"
          fi

          # Copy and rename Release AAB (Google Play Bundle)
          if [ -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            cp "app/build/outputs/bundle/release/app-release.aab" "release-artifacts/CapGrok-${VERSION_TAG}-bundle.aab"
          fi

          echo "Artifacts prepared in release-artifacts/:"
          ls -lh release-artifacts/

      - name: Upload Artifacts to GitHub Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: CapGrok-Android-Build-${{ steps.prepare_artifacts.outputs.version_tag }}
          path: release-artifacts/*
          retention-days: 30

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true' || github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_artifacts.outputs.version_tag }}
          name: ${{ github.event.inputs.release_title || steps.prepare_artifacts.outputs.version_tag }}
          body: |
            ## 🚀 CapGrok AI Video Caption Editor (${{ steps.prepare_artifacts.outputs.version_tag }})

            ### 📦 Download Links
            - **Release APK:** `CapGrok-${{ steps.prepare_artifacts.outputs.version_tag }}-release.apk`
            - **Debug APK:** `CapGrok-${{ steps.prepare_artifacts.outputs.version_tag }}-debug.apk`
            - **Google Play Bundle:** `CapGrok-${{ steps.prepare_artifacts.outputs.version_tag }}-bundle.aab`

            ### ✨ Key Features
            - **Grok (xAI) Voice Cadence & Audio Analysis** (WPM, Tone, Energy Score, Punch Keywords)
            - **Google Gemini Audio Summarization & Synced Subtitles** (Bengali & English)
            - **CapCut-Style Video & Caption Editor** (Hormozi, Bounce, Minimal Pill, Karaoke, Neon)
            - **Hardware MediaCodec Video Rendering** (Fast direct MP4 export)
            - **FFmpeg & ASS/SRT Exporter**

            *Automatically generated by GitHub Actions CI/CD pipeline.*
          files: |
            release-artifacts/*.apk
            release-artifacts/*.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
